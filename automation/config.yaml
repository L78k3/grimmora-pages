ollama:
  host: "http://localhost:11434"
  model: "llama3.1"
  fallback_model: "qwen2.5:14b"
  timeout_seconds: 120

home_assistant:
  webhook_url: "https://ha.l78k3.uk/api/webhook/ollama_job_waiting"

paths:
  content_dir: "content"
  inbox_dir: "_inbox"
  processed_dir: "_inbox/processed"
  dictionary_file: "automation/dictionary/mechanics.json"
  manifest_file: "automation/manifest.json"

target_headers:
  npc:
    primary: "## History"
    alternates: ["## Campaign History", "## History with the Party", "## Biography"]
  location:
    primary: "## History"
    alternates: ["## Campaign history", "## Our Experience", "## Events"]
  item:
    primary: "## Lore & History"
    alternates: ["## Lore", "## History"]
  pc:
    primary: "## Biography"
    alternates: ["## Notable Exploits (Chronicle Archive)"]
  organization:
    primary: "## Our Interactions"
    alternates: ["## History", "## Overview"]
  quest:
    primary: "## Quest Steps"
    alternates: ["## Notes"]

git:
  safe_branch_prefix: "auto/entry-"
  review_branch_prefix: "auto/entry-"
  review_branch_suffix: "-review"